services:
  # Gateway API Web Service (free tier)
  - type: web
    name: gateway-api
    env: docker
    dockerfilePath: apps/gateway-api/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: gateway-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: gateway-redis
          property: connectionString
      - key: RUN_MIGRATIONS
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  # Redis Cache / KeyValue Instance (free tier)
  - type: keyvalue
    name: gateway-redis
    plan: free
    ipAllowList: []

# Postgres Database (free tier)
databases:
  - name: gateway-db
    plan: free
    postgresMajorVersion: 15
