services:
  # 1. Gateway API Web Service
  - type: web
    name: gateway-api
    env: docker
    dockerfilePath: apps/gateway-api/Dockerfile
    context: .
    plan: starter
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: gateway-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: gateway-redis
          property: connectionString
      - key: PII_SERVICE_URL
        fromService:
          type: pservice
          name: pii-service
          property: host
      - key: RUN_MIGRATIONS
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  # 2. Background Worker Service
  - type: worker
    name: log-worker
    env: docker
    dockerfilePath: apps/worker/Dockerfile
    context: .
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gateway-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: gateway-redis
          property: connectionString

  # 3. PII Redaction Private Service
  - type: pservice
    name: pii-service
    env: docker
    dockerfilePath: Dockerfile
    context: apps/pii-service
    plan: starter
    envVars:
      - key: PORT
        value: 8000

# Databases and Redis Instances
databases:
  - name: gateway-db
    plan: starter
    postgresMajorVersion: 15

redis:
  - name: gateway-redis
    plan: starter
